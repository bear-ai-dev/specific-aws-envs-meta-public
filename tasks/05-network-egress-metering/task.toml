schema_version = "1.4"

[task]
name = "meteringco/network-egress-metering"
version = "1.0.0"
description = "Turn per-machine outbound network traffic into billable usage: total the bytes each machine transmitted over the interval whatever its power state, charge one figure per customer, and bill nothing at all for a machine that reported no traffic rather than billing it as zero."
keywords = ["aws", "cloudwatch", "ec2", "metering", "billing", "network-egress", "typescript", "nestjs"]

[[task.authors]]
name = "meteringco-rl-envs"

[metadata]
difficulty = "hard"
category = "aws-infrastructure"
source = "meteringco-codebases"
codebase = "meteringco-backend/network-egress-metering"
task_kind = "feature-removal"
tags = [
    "real-codebase",
    "cloudwatch-metric-series",
    "sparse-metric-series",
    "metric-statistic-choice",
    "cross-account-role-assumption",
    "resource-tag-enrolment",
    "usage-measurement-publication",
    "scheduled-collectors",
]

[agent]
user = "agent"
timeout_sec = 14400

[verifier]
user = "root"
timeout_sec = 1800

[environment]
workdir = "/app"
build_timeout_sec = 2400
cpus = 2
memory_mb = 6144
storage_mb = 20480
network_mode = "public"

[environment.env]
TZ = "Etc/UTC"
AWS_ENDPOINT_URL = "http://127.0.0.1:4566"
AWS_ACCESS_KEY_ID = "LOCALMETERINGKEY01"
AWS_SECRET_ACCESS_KEY = "billing-secret"
# The SDK in this tree reads AWS_REGION only. A client built without an
# explicit region has no other source for it inside the container.
AWS_REGION = "us-east-1"
AWS_DEFAULT_REGION = "us-east-1"

[environment.healthcheck]
command = "test -f /tmp/task-infra/.ready"
interval_sec = 5
timeout_sec = 5
start_period_sec = 30
retries = 12
